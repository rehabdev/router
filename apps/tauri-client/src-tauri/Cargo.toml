[package]
name = "asira-router-client"
version.workspace = true
description = "Windows selective routing client for Asira Router"
authors = ["Asira Router"]
edition.workspace = true

[lib]
name = "asira_router_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
asira-tunnel = { path = "../../../crates/tunnel" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = [] }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

