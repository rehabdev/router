[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/tunnel",
    "apps/server",
    "apps/client",
    "apps/tauri-client/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hmac = "0.12"
ipnet = "2"
quinn = "0.11"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tun = { version = "0.7.13", features = ["async"] }

